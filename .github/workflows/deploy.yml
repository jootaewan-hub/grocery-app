name: 테스트 후 GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /grocery-app/
          # 이 키는 공개용이라 브라우저에 그대로 들어간다. 비밀값(서비스 롤 키, API 키 등)은 절대 여기에 넣지 않는다.
          # Supabase 공개용(publishable) 키. 브라우저에 그대로 들어가는 값이며 데이터는 RLS로 보호된다.
          VITE_SUPABASE_URL: https://kifdfpbwiebfgvdumqjf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bQ2BOXHX_7-_l_tvVrel6A_-2atkMYK
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
